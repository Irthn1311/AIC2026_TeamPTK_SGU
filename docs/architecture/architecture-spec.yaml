project:
  repository: AIC2026_TeamPTK_SGU
  system_name: TRIAGE-EG
  full_name: Tool-Routed Intelligent Agent with Event-Graph and Semantic-Moment Grounding
  version: '1.1'
  language: vi
  description: Trợ lý truy xuất video đa phương thức dựa trên điều phối công cụ, đồ thị sự kiện, định vị khoảnh
    khắc ngữ nghĩa và kiểm chứng bằng chứng.
  central_message: TRIAGE-EG tìm đúng video bằng index, hiểu chuỗi bằng Event Graph, chọn đúng frame bằng Semantic
    Moment Localizer, kiểm chứng bằng raw evidence và tối ưu điểm bằng Ranked Answer List Constructor.
  principles:
  - Retrieval-first, not LLM-first
  - Event Graph only after candidate retrieval
  - Graph-enhanced, not graph-only
  - Raw video is source of truth
  - No rich full-corpus Event Graph
  - Shot differs from Event; Event Interval differs from Semantic Moment
  - Agent only orchestrates registered tools
  - No GNN in baseline
  - Every hypothesis has confidence, provenance, status and evidence refs
  - Deterministic fallback without Agent or VLM
