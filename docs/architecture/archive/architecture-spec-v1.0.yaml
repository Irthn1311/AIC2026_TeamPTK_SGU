    role: BTC object JSON
    status: CONFIRMED
  shot_detector:
    interface: ShotDetector
    current_direction: Shot detection
    candidates: [TransNetV2]
    selected: null
    status: CANDIDATE
    note: Final detector must be selected by benchmark.
  team_visual_encoder:
    interface: MultimodalEncoder
    candidates: [CLIP, OpenCLIP, compatible multimodal encoder]
    selected: null
    status: CANDIDATE
    note: Final model must be selected by benchmark.
