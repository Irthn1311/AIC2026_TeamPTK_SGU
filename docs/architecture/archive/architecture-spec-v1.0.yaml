project:
  repository: AIC2026_TeamPTK_SGU
  system_name: TRIAGE-EG
  full_name: Tool-Routed Intelligent Agent with Event-Graph and Semantic-Moment Grounding
  version: '1.0'
  language: vi
  description: Trợ lý truy xuất video đa phương thức dựa trên điều phối công cụ, đồ thị sự kiện, định vị khoảnh khắc ngữ nghĩa và kiểm chứng bằng chứng.
  central_message: TRIAGE-EG tìm đúng video bằng index, hiểu chuỗi bằng Event Graph, chọn đúng frame bằng Semantic Moment Localizer, kiểm chứng bằng raw evidence và tối ưu điểm bằng Ranked Answer List Constructor.
  principles:
    - Retrieval-first, không phải LLM-first.
    - Event Graph nằm sau candidate retrieval; hệ thống graph-enhanced, không graph-only.
    - Raw video là source of truth; mọi representation khác là evidence hỗ trợ.
    - Chỉ xây Candidate Local Event Graph cho top videos hoặc query phức tạp.
    - Shot khác Event; Event interval khác Semantic Moment submission frame.
    - Agent chỉ điều phối tool và không tự tạo ID, score, identity hoặc causal truth.
    - Baseline không dùng GNN; ưu tiên filtering, traversal, DP, beam search và constraint scoring.
    - Mọi hypothesis có confidence, provenance, status và evidence references.
    - Luôn có deterministic fallback.

