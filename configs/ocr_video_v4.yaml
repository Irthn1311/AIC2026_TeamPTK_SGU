paths:
  dataset_root: datasets_L21
  video_root: datasets_L21/Videos_L21_a/video
  output_dir: outputs/ocr_video_v4_test
  keyframe_v2_global_map: outputs/keyframe_v2_full/indexes/keyframe_v2_global_map.parquet
  btc_mapping_root: datasets_L21/map-keyframes-aic25-b1/map-keyframes
  keyframe_v2_root: outputs/keyframe_v2_full

sampling:
  sparse_fps: 2.0
  dense_fps: 0.0
  dense_window_sec: 0.0
  detection_confidence_threshold: 0.45
  dense_trigger_regions:
    - headline
    - ticker
    - scene_text

ocr:
  engine: paddle_vietocr
  paddle_stage_python:
  paddle_device: gpu:0
  paddle_detection_model_dir: .ocr_cache/paddlex/official_models/PP-OCRv6_medium_det
  paddle_recognition_model_dir: .ocr_cache/paddlex/official_models/PP-OCRv6_medium_rec
  vietocr_config: configs/vietocr_vgg_transformer_local.yaml
  languages:
    - vi
    - en
  use_vietocr_if_available: true
  vietocr_batch_size: 64
  min_confidence: 0.35
  batch_size: 32

temporal_merge:
  max_gap_seconds: 3.0
  min_bbox_iou: 0.30
  min_text_similarity: 0.70

index:
  build: true
  model_name: intfloat/multilingual-e5-small
  batch_size: 32

debug:
  max_segments: 80
  contact_sheet_cols: 2
  thumb_width: 360
  thumb_height: 202
