stage2_version: "0.1.0"

runtime:
  default_language: auto
  default_top_k: 100

hardware:
  mode: auto
  # Frozen by approved G1.1 evidence: CLIP and translator AUTO select CUDA
  # when compatible CUDA hardware is available; CPU fallback remains valid.
  auto_clip_promoted: true
  auto_translator_promoted: true

video:
  backend: auto
  # AUTO stays on OpenCV. NVDEC remains a valid explicit/research backend, but
  # is not production-promoted for MB1 or neural video consumers.
  auto_nvdec_promoted: false

clip:
  device: auto
  batch_size: 64

translator:
  device: auto
  batch_size: 16
  lazy_load: true

search:
  backend: existing_stage1_exact
  max_top_k: 100
  chunk_rows: 16384
