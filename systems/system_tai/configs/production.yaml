# ==============================================================================================================
# AIC 2026 SYSTEM TAI - CANONICAL PRODUCTION & TOURNAMENT CONFIGURATION
# Profile: system_tai_production_v1
# Specification: Sheet 08 & Sheet 09 Accepted V1
# ==============================================================================================================

version: "1.0.0"
profile_name: "system_tai_production_v1"
environment: "production"

# --- Hardware & Acceleration (PROVEN_WINNER) ---
system:
  device: "auto"                    # auto | cuda | cpu
  allow_model_download: true
  num_workers: 4
  log_level: "INFO"
  chunk_size: 50000                 # Vector retrieval matrix chunk size

# --- Core Retrieval & Embedding (PROVEN_WINNER) ---
retrieval:
  clip_model: "ViT-B/32"
  vector_index_backend: "faiss"     # faiss | numpy
  faiss_index_type: "exact_ip"      # exact_ip | ivf_flat
  bm25_k1: 1.5
  bm25_b: 0.75
  rrf_k: 60.0
  fusion_weights:
    vector: 1.0
    bm25_text: 0.35
    asr_speech: 0.25

# --- Textual KIS (Known-Item Search) Workspace (PROVEN_WINNER) ---
kis:
  status: "PROVEN_WINNER"
  enable_dynamic_translation: true
  translation_model_name: "vinai/vinai-translate-vi2en-v2"
  translation_revision: "ae7baa85da07dbe8e23ac26a9f5ef560c17e2138"
  translation_allow_model_download: true
  translation_max_clip_tokens: 75
  language_policy: "en_only"
  top_k_candidates: 100
  coarse_to_fine_refinement: true
  refine_top_n_anchors: 3
  temporal_window_seconds: 2.0      # [-2s, +2s] around keyframe anchor
  sampling_stride_frames: 1         # dense 1-frame stride during local refinement

# --- Video Q&A Workspace (PROVEN_WINNER + OPTIONAL EXTENSIONS) ---
qa:
  status: "RELEASE_CANDIDATE"
  output_top_k: 100
  language_policy: "en_only"        # PROVEN_WINNER: en_only translation-augmented localization
  video_conditioned_evidence: true  # PROVEN_WINNER
  keyframe_evidence_bank: true      # PROVEN_WINNER
  ranking_policy: "decision_10_ranked_top100"  # PROVEN_WINNER: Tier 1..7 RALC ranked constructor
  temporal_refinement:
    enabled: true                   # PROVEN_WINNER
    max_video_candidates: 8         # Fast execution cap (8 candidate videos)
    seeds_per_video: 1              # Best anchor per video
    total_seed_cap: 8               # Fast execution cap
    temporal_window_frames: 60      # [-30, +30] raw video window
  evidence_providers:
    visual_ontology:
      status: "MECHANICS_VERIFIED"
      enabled: true
      ontology_path: "benchmarks/l21_150_diagnostic/qa_dev_visual_ontology.json"
    ocr:
      status: "OPTIONAL_MECHANICS_VERIFIED"
      enabled: false                # Default disabled in pure visual mode; enable when text is key
      executable: "tesseract"
      languages: ["eng", "vie"]
      evidence_frame_budget: 8
      page_segmentation_mode: 6
    asr:
      status: "OPTIONAL_MECHANICS_VERIFIED"
      enabled: false                # Default disabled in pure visual mode; enable when speech transcript is provided
      model_size: "base"
      language: "vi"
      sample_rate: 16000

# --- TRAKE (Temporal Retrieval Across Key Events) Workspace (PROVEN_WINNER) ---
trake:
  status: "PROVEN_WINNER"
  search_strategy: "video_first"    # PROVEN_WINNER: video_first restricted candidate search
  candidate_video_cap: 32
  anchors_per_video_event: 10
  solver_algorithm: "bounded_beam"  # PROVEN_WINNER: bounded_beam solver
  beam_width: 100
  output_top_k_chains: 100
  temporal_order_policy: "non_decreasing"  # PROVEN_WINNER: F_1 <= F_2 <= ... <= F_N
  shared_raw_region_refinement: true

# --- Submission & Validation Rules (BTC P0-A - PROVEN_WINNER) ---
submission:
  status: "PROVEN_WINNER"
  schema_version: "1.0"
  max_rows_per_query: 100
  rank_policy: "strictly_contiguous_1_to_n"
  uniqueness_policy: "strictly_no_duplicates"
  coordinate_space: "frame_idx"     # convert actual_frame_id -> official frame_idx
  export_format: "csv"              # UTF-8 without BOM
