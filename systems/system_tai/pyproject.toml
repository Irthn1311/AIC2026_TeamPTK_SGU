[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic2026-system-tai"
version = "0.1.0"
description = "Isolated KIS foundation for Nguyen Tai's AIC 2026 system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"system_tai.kis" = ["resources/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
filterwarnings = [
  "ignore::DeprecationWarning:.*(SwigPy|swigvarlink|importlib).*",
  "ignore:builtin type SwigPy.*:DeprecationWarning",
  "ignore:.*testclient.*:DeprecationWarning",
  "ignore:.*httpx.*:DeprecationWarning",
  "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*",
  "ignore:.*deprecated.*:Warning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
