schema_version: 1
benchmark_id: system_tai_kis_pilot_three_groups_v1
description: >-
  Phase 2.6 pilot over three audited videos and three semantic intents. Positive
  labels were selected after retrieval inspection and therefore have
  retrieval-selection bias. This is not an official or dataset-wide benchmark.
queries:
  - query_id: city_pedestrians_vi
    language: vi
    text: nhiều người đi bộ trên đường phố thành thị
    semantic_group_id: city_pedestrians
    variant_type: vietnamese_direct
    relevant_frames: &city_frames
      - {video_id: L21_V002, frame_id: 20574}
      - {video_id: L22_V001, frame_id: 19821}
      - {video_id: L21_V001, frame_id: 23982}
    relevant_video_ids: &city_videos [L21_V001, L21_V002, L22_V001]
    annotation_notes: Human-verified pilot labels supplied after retrieval inspection; retrieval-selection bias applies.
    annotation_status: verified
    source_scope: &pilot_scope [L21_V001, L21_V002, L22_V001]
  - query_id: city_pedestrians_en_translation
    language: en
    text: many people walking on a city street
    semantic_group_id: city_pedestrians
    variant_type: english_translation
    relevant_frames: *city_frames
    relevant_video_ids: *city_videos
    annotation_notes: Comparable English translation using the same verified positives and source scope.
    annotation_status: verified
    source_scope: *pilot_scope
  - query_id: city_pedestrians_en_expansion
    language: en
    text: a busy urban street with a crowd of pedestrians walking along the road
    semantic_group_id: city_pedestrians
    variant_type: english_expansion
